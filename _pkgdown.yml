url: https://sdvplotR.sportsdataverse.org/
title: sdvplotR
description: "Sports team logo plots in ggplot2, gt and reactable across the SportsDataverse"

# pkgdown renders every top-level and .github/*.md file as a page; keep the
# contributor/agent notes out of the search index so results stay on-topic.
search:
  exclude:
  - CLAUDE.html
  - copilot-instructions.html
  - PULL_REQUEST_TEMPLATE.html

template:
  bootstrap: 5
  light-switch: true
  bootswatch: flatly
  includes:
    in_header: |
      <!-- Privacy-friendly analytics by Plausible -->
      <script async src="https://plausible.io/js/pa-Y-iB-vquikSg24pTisxby.js"></script>
