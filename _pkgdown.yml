url: https://sdvplotR.sportsdataverse.org/
title: sdvplotR

# pkgdown renders every top-level and .github/*.md file as a page (the PR
# template is skipped by its lowercase name). The pkgdown workflow deletes
# CLAUDE.html and copilot-instructions.html after the build; keep them out of
# the search index too.
search:
  exclude:
  - CLAUDE.html
  - copilot-instructions.html

template:
  bootstrap: 5
  light-switch: true
  bootswatch: flatly
  includes:
    in_header: |
      <!-- Privacy-friendly analytics by Plausible -->
      <script async src="https://plausible.io/js/pa-Y-iB-vquikSg24pTisxby.js"></script>
      <script src="https://sdvplotr.sportsdataverse.org/plausible-init.js"></script>
      <script type="application/ld+json">
      {"@context":"https://schema.org","@graph":[
        {"@type":"SoftwareSourceCode","@id":"https://sdvplotr.sportsdataverse.org/#package",
         "name":"sdvplotR","alternateName":"sdvplotR: Sports Team Logo Plots in 'ggplot2', 'gt' and 'reactable'",
         "description":"An R package for plotting team logos, wordmarks, player headshots and team colors across the 28 leagues of the SportsDataverse team index, from the NFL, NBA, WNBA, MLB and NHL to college sports and soccer, in ggplot2, gt, reactable, plotly, ggiraph and leaflet.",
         "url":"https://sdvplotr.sportsdataverse.org/",
         "codeRepository":"https://github.com/sportsdataverse/sdvplotR",
         "programmingLanguage":{"@type":"ComputerLanguage","name":"R"},
         "license":"https://opensource.org/licenses/MIT",
         "runtimePlatform":"R (>= 4.1.0)",
         "keywords":["sports analytics","data visualization","ggplot2","team logos","NFL","NBA","WNBA","MLB","NHL","college football","college basketball"],
         "author":{"@id":"https://sdvplotr.sportsdataverse.org/#author"},
         "publisher":{"@id":"https://sportsdataverse.org/#org"}},
        {"@type":"Person","@id":"https://sdvplotr.sportsdataverse.org/#author",
         "name":"Saiem Gilani","url":"https://github.com/saiemgilani",
         "sameAs":"https://orcid.org/0000-0002-7194-9067"},
        {"@type":"Organization","@id":"https://sportsdataverse.org/#org",
         "name":"SportsDataverse","url":"https://sportsdataverse.org",
         "sameAs":["https://github.com/sportsdataverse","https://x.com/sportsdataverse"]}
      ]}
      </script>
  bslib:
    primary: "#0B1A33"
    secondary: "#2680E4"
    success: "#2680E4"
    link-color: "#1D6FCB"
    link-hover-color: "#1a5a9e"
    nav-link-hover-color: "#2680E4"
    nav-link-focus-color: "#2680E4"
    nav-link-dropdown-toggle-hover-color: "#2680E4"
    navbar-hover-color: "#2680E4"
    navbar-brand-hover-color: "#2680E4"
    nav-tabs-link-active-bg: "#2680E4"
    nav-pills-link-active-color: "#2680E4"
    btn-link-color: "#1D6FCB"
    btn-link-hover-color: "#1a5a9e"
    dropdown-link-color: "#2680E4"
    input-btn-focus-color: "#2680E4"
    dropdown-dark-link-hover-bg: "#2680E4"
    border-radius: 0.5rem
    btn-border-radius: 0.25rem
  opengraph:
    image:
      src: "https://sdvplotR.sportsdataverse.org/sdvplotR-social-card.png"
      alt: "sdvplotR: team logos, wordmarks, headshots and colors in ggplot2, gt and reactable"
    twitter:
      creator: "@saiemgilani"
      site: "@SportsDataverse"
      card: summary_large_image

