    href: https://github.com/Kazink36
  Camden Kay:
    href: https://x.com/camdenkay
  Andrew Weatherman:
    href: https://github.com/andreweatherman

home:
  title: Sports Team Logo Plots in ggplot2, gt and reactable
  # the page's meta description (pkgdown reads home.description; without it,
  # the whole DESCRIPTION Description)
  description: "Team logos, wordmarks, headshots and colors in ggplot2, gt and reactable, and interactive plotly, ggiraph and leaflet charts, across the 28 leagues of the SportsDataverse"
  links:
  - text: Browse the SportsDataverse
    href: https://sportsdataverse.org/
  - text: Gallery
    href: articles/gallery.html
  - text: sdvplotR cheat sheet (PDF)
    href: https://sportsdataverse.org/cheatsheets/sdvplotR.pdf
  - text: All SportsDataverse cheat sheets
    href: https://sportsdataverse.org/cheatsheets

reference:
  - title: "Logos, Wordmarks & Headshots"
    desc: >
      ggplot2 geoms and ggproto objects for rendering team logos, wordmarks
      and player headshots on plots. Every geom takes a `league` argument.
    contents:
      - geom_sdv_logos
      - geom_sdv_wordmarks
      - geom_sdv_headshots
  - title: "Theme Elements"
    desc: >
      Image-based ggplot2 theme elements for axis text — replace tick labels
      with team logos, wordmarks or player headshots.
    contents:
      - element_sdv_logo
  - title: "Scales & Axes"
    desc: >
      Team color / fill scales, logo and headshot axis scales, and the
      matching theme helpers.
    contents:
      - scale_sdv
      - scale_axes_sdv
      - theme_sdv
  - title: "gt Table Helpers"
    desc: >
      Embed team logos, wordmarks and player headshots inside gt table cells
      or column labels, and stack team-colored text.
    contents:
      - gt_sdv_logos
      - gt_sdv_wordmarks
      - gt_sdv_headshots
      - gt_sdv_cols_label
      - gt_merge_stack_team_color
  - title: "SportsDataverse Table Themes"
    desc: >
      The SportsDataverse house table, in light and dark, and a version dressed
      in any team's colors.
    contents:
      - gt_theme_sdv
      - gt_theme_sdv_team
  - title: "gt Table Themes"
    desc: >
      Editorial and broadcast-style themes for gt tables, ported from gtUtils.
      `theme_bg` holds each theme's background color for matching a saved
      image's canvas.
    contents:
      - gt_theme_almanac
      - gt_theme_athletic
      - gt_theme_booktabs
      - gt_theme_broadsheet
      - gt_theme_brutalist
      - gt_theme_drench
      - gt_theme_gtutils
      - gt_theme_kenpom
      - gt_theme_midnight
      - gt_theme_ncaa
      - gt_theme_pl
      - gt_theme_savant
      - gt_theme_scoreboard
      - gt_theme_sofa
      - gt_theme_swiss
      - gt_theme_terminal
      - gt_theme_tier
      - gt_theme_tufte
      - gt_theme_preview
      - pal_midnight
      - theme_bg
  - title: "Table themes by source"
    desc: >
      122 surveyed table styles, by the name of the source they follow
      (`datagolf`, `wikipedia`, `nejm`, ...), shared with the Python and
      JavaScript packages. `gt_theme_source()` and `reactable_sdv_theme()`
      apply any of them; the shortcuts name the most useful 20.
    contents:
      - sdv_table_themes
      - table_theme_spec
      - gt_theme_source
      - reactable_sdv_theme
      - gt_theme_basketball_reference
      - gt_theme_datagolf
      - gt_theme_fivethirtyeight_site
      - gt_theme_wikipedia
      - gt_theme_cleaning_the_glass
      - gt_theme_bbc_sport
      - gt_theme_opta_analyst
      - gt_theme_our_world_in_data
      - gt_theme_bloomberg_markets
      - gt_theme_aer
      - gt_theme_nzz
      - gt_theme_guardian
      - gt_theme_barttorvik
      - gt_theme_espn_site
      - gt_theme_gov_uk
      - gt_theme_washington_post
      - gt_theme_reuters_graphics
      - gt_theme_formula1
      - gt_theme_dunks_and_threes
      - gt_theme_economist
  - title: "gt Table Annotations"
    desc: Captions, headers, cut lines, marginalia, watermarks and social tags.
    contents:
      - gt_538_caption
      - gt_cutline
      - gt_marginalia
      - gt_column_subheaders
      - gt_social_tag
      - gt_title_header
      - gt_watermark
  - title: "gt Table Coloring"
    desc: Legends, color pills, percentile bars, rank and result colors, highlights.
    contents:
      - gt_legend_continuous
      - gt_legend_discrete
      - gt_color_pills
      - gt_percentile_bar
      - gt_row_accent
      - gt_color_ranks
      - gt_color_results
      - gt_group_stripes
      - gt_highlight_cells
      - gt_highlight_na
      - gt_outliers
      - gt_indicator_boxes
      - gt_spotlight
  - title: "gt Table Formatting"
    desc: Borders, deltas, rank and tally formats, significance, fonts, tiers.
    contents:
      - gt_bold_rows
      - gt_border_bars_bottom
      - gt_border_bars_top
      - gt_border_grid
      - gt_delta
      - gt_fmt_rank
      - gt_fmt_tally
      - gt_scale_note
      - gt_significance
      - gt_set_font
      - gt_tiers
      - gt_wrap_labels
  - title: "gt Table Layout"
    desc: Arrange several tables, or one long table, into a single graphic.
    contents:
      - gt_grid
      - gt_snake
      - gt_snake_align
      - gt_stack_tables
  - title: "Saving gt Tables"
    desc: Save, crop and pad tables for publication or social media.
    contents:
      - gt_save_batch
      - gt_save_crop
      - gt_social_crop
  - title: "reactable Table Helpers"
    desc: >
      Cell renderers, column headers and team-colored cell styles for
      reactable tables.
    contents:
      - reactable_sdv_images
      - reactable_sdv_cols_label
      - reactable_sdv_team_color
  - title: "Teams and Identifiers"
    desc: >
      The shared team index: list leagues and teams, resolve identifiers from
      any source, colours, logo and headshot URLs, and the data versions and
      cache.
    contents:
      - sdv_leagues
      - sdv_teams
      - sdv_resolve
      - sdv_suggest
      - sdv_team_colors
      - sdv_color_palette
      - sdv_team_factor
      - sdv_logo_url
      - sdv_marks
      - sdv_headshot_url
      - sdv_versions
      - sdv_clear_cache
  - title: "Court and Pitch Coordinates"
    desc: >
      Convert stats.nba.com shot locations and any soccer provider's event
      coordinates into the frames the playing surfaces draw.
    contents:
      - sdv_court_coords
      - sdv_pitch_coords
  - title: "Premade Plots"
    desc: High-level functions that build complete branded plots.
    contents:
      - sdv_team_tiers
  - title: "Playing Surfaces"
    desc: >
      Every regulation court, field, rink and sheet 'sportyR' draws (59 surface
      keys, lacrosse, tennis, volleyball, curling and softball included); a
      team league's surface takes a team's colors and its logo at center.
    contents:
      - sdv_surface
  - title: "Interactive plots and maps"
    desc: >
      Team marks on plotly charts, interactive ggiraph layers and leaflet maps.
    contents:
      - add_sdv_logos
      - sdv_axis_logos
      - sdv_colorway
      - geom_sdv_logos_interactive
      - addSdvLogoMarkers
  - title: "Plot Titles"
    desc: Add a logo or image next to a ggplot2 title.
    contents:
      - ggtitle_image
  - title: "Example Data"
    desc: Real final standings that the reference examples run on.
    contents:
      - sdv_example_standings
  - title: "Re-exported from ggpath"
    desc: Generic image geoms and theme elements provided by the ggpath backend.
    contents:
      - reexports
articles:
  - title: "Gallery"
    contents:
      - gallery
  - title: "Getting Started"
    contents:
      - getting-started
  - title: "Per-Sport Articles"
    desc: >
      Data ingest with the companion SportsDataverse package, then sdvplotR
      visualization, for each sport.
    contents:
      - nfl-viz
      - cfb-viz
      - nba-viz
      - wnba-viz
      - mlb-viz
      - nhl-viz
      - mbb-viz
      - wbb-viz
      - soccer-viz
  - title: "Cookbooks"
    desc: >
      Task-oriented, cross-league recipes: logos and headshots in ggplot2,
      team colors and themes, interactive charts, playing surfaces and shot
      charts, and reactable tables (with reactablefmtr).
    contents:
      - cookbook-ggplot-logos
      - cookbook-colors-themes
      - cookbook-interactive
      - cookbook-surfaces-shot-charts
      - reactable-integration
      - cookbook-reactable
  - title: "Tables cookbook"
    desc: >
      gt tables on SportsDataverse data: the house themes, standings with cut
      lines, percentile bars, rank changes, schedule matrices, tier lists,
      faceted and snaked layouts, and saving for social. The gt_* toolkit
      comes from Andrew Weatherman's gtUtils.
    contents:
      - sdv-table-themes
      - articles/table-themes
      - gt-toolkit
      - styling
      - saving_tables
      - border_bars
      - delay_tables
      - grid_tables
      - schedule_matrix
      - tier_list
      - window_wins
  - title: "Recipes"
    desc: >
      Real-world tasks worked end to end: the brief, the data, a first draft,
      the fixes that make it publishable, and the export at the size it will be
      posted. Then static versions of SportsDataverse web visuals, and
      end-to-end workflows.
    contents:
      - recipe-nfl-epa-scatter
      - recipe-cfb-conference-table
      - recipe-nba-net-rating-quadrant
      - recipe-wnba-scoring-leaders-card
      - recipe-mlb-run-differential
      - recipe-nhl-shot-map
      - recipe-college-hoops-tiers
      - recipe-rank-bump-chart
      - recipe-head-to-head-card
      - recipe-wbb-conference-standings
      - neighbour-ranks
      - shot-grid
      - rolling-form
      - signature-ribbon
      - workflows
  - title: "Interactive"
    desc: >
      The recipes as charts and maps a reader can hover, filter and zoom, with
      ggiraph, plotly and leaflet. Start with the Interactive Charts cookbook;
      every leaderboard and per-sport article also ends with an interactive
      version.
    contents:
      - recipe-nfl-epa-interactive
      - recipe-nba-net-rating-interactive
      - recipe-nhl-shot-map-interactive
      - recipe-mlb-run-differential-interactive
      - recipe-cfb-stadium-map
      - cookbook-leaflet-maps
  - title: "Leaderboards"
    desc: >
      Each league's current season, rebuilt every week with this site: the
      season to date while games are played, the last full season in the
      offseason.
    contents:
      - leaderboard-nfl-weekly
      - leaderboard-cfb-weekly
      - leaderboard-nba
      - leaderboard-wnba
      - leaderboard-mlb
      - leaderboard-nhl
      - leaderboard-dashboards
  - title: "Automation"
    desc: >
      Make and post social graphics on a schedule.
    contents:
      - automation-social
      - social-posting

