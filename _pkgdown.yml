home:
  title: sdvplotR • Sports Team Logo Plots in ggplot2, gt and reactable
  links:
  - text: Browse the SportsDataverse
    href: https://sportsdataverse.org/
  - text: Cheat sheets (PDF)
    href: https://sportsdataverse.org/cheatsheets

reference:
  - title: "Logos, Wordmarks & Headshots"
    desc: >
      ggplot2 geoms and ggproto objects for rendering team logos, wordmarks
      and player headshots on plots. Every geom takes a `sport` argument.
    contents:
      - geom_sdv_logos
      - geom_sdv_wordmarks
      - geom_sdv_headshots
  - title: "Theme Elements"
    desc: >
      Image-based ggplot2 theme elements for axis text — replace tick labels
      with team logos, wordmarks or player headshots.
    contents:
      - element_sdv_logo
  - title: "Scales & Axes"
    desc: >
      Team color / fill scales, logo and headshot axis scales, and the
      matching theme helpers.
    contents:
      - scale_sdv
      - scale_axes_sdv
      - theme_sdv
  - title: "gt Table Helpers"
    desc: >
      Embed team logos, wordmarks and player headshots inside gt table cells
      or column labels, and stack team-colored text.
    contents:
      - gt_sdv_logos
      - gt_sdv_wordmarks
      - gt_sdv_headshots
      - gt_sdv_cols_label
      - gt_merge_stack_team_color
  - title: "SportsDataverse Table Themes"
    desc: >
      The SportsDataverse house table, in light and dark, and a version dressed
      in any team's colors.
    contents:
      - gt_theme_sdv
      - gt_theme_sdv_team
  - title: "gt Table Themes"
    desc: >
      Editorial and broadcast-style themes for gt tables, ported from gtUtils.
      `theme_bg` holds each theme's background color for matching a saved
      image's canvas.
    contents:
      - gt_theme_almanac
      - gt_theme_athletic
      - gt_theme_booktabs
      - gt_theme_broadsheet
      - gt_theme_brutalist
      - gt_theme_drench
      - gt_theme_gtutils
      - gt_theme_kenpom
      - gt_theme_midnight
      - gt_theme_ncaa
      - gt_theme_pl
      - gt_theme_savant
      - gt_theme_scoreboard
      - gt_theme_sofa
      - gt_theme_swiss
      - gt_theme_terminal
      - gt_theme_tier
      - gt_theme_tufte
      - gt_theme_preview
      - pal_midnight
      - theme_bg
  - title: "gt Table Annotations"
    desc: Captions, headers, cut lines, marginalia, watermarks and social tags.
    contents:
      - gt_538_caption
      - gt_cutline
      - gt_marginalia
      - gt_column_subheaders
      - gt_social_tag
      - gt_title_header
      - gt_watermark
  - title: "gt Table Coloring"
    desc: Legends, color pills, percentile bars, rank and result colors, highlights.
    contents:
      - gt_legend_continuous
      - gt_legend_discrete
      - gt_color_pills
      - gt_percentile_bar
      - gt_row_accent
      - gt_color_ranks
      - gt_color_results
      - gt_group_stripes
      - gt_highlight_cells
      - gt_highlight_na
      - gt_outliers
      - gt_indicator_boxes
      - gt_spotlight
  - title: "gt Table Formatting"
    desc: Borders, deltas, rank and tally formats, significance, fonts, tiers.
    contents:
      - gt_bold_rows
      - gt_border_bars_bottom
      - gt_border_bars_top
      - gt_border_grid
      - gt_delta
      - gt_fmt_rank
      - gt_fmt_tally
      - gt_scale_note
      - gt_significance
      - gt_set_font
      - gt_tiers
      - gt_wrap_labels
  - title: "gt Table Layout"
    desc: Arrange several tables, or one long table, into a single graphic.
    contents:
      - gt_grid
      - gt_snake
      - gt_snake_align
      - gt_stack_tables
  - title: "Saving gt Tables"
    desc: Save, crop and pad tables for publication or social media.
    contents:
      - gt_save_batch
      - gt_save_crop
      - gt_social_crop
  - title: "reactable Table Helpers"
    desc: >
      Cell renderers, column headers and team-colored cell styles for
      reactable tables.
    contents:
      - reactable_sdv_images
      - reactable_sdv_cols_label
      - reactable_sdv_team_color
  - title: "Team Utilities"
    desc: >
      Validate, clean and factor-order team abbreviations; look up team
      reference data and colors; control the image cache.
    contents:
      - supported_sports
      - valid_team_names
      - team_reference
      - clean_team_abbrs
      - resolve_historical_abbr
      - sdv_team_colors
      - sdv_color_palette
      - sdv_team_factor
      - sdvplotR_clear_cache
  - title: "Premade Plots"
    desc: High-level functions that build complete branded plots.
    contents:
      - sdv_team_tiers
  - title: "Plot Titles"
    desc: Add a logo or image next to a ggplot2 title.
    contents:
      - ggtitle_image
  - title: "Re-exported from ggpath"
    desc: Generic image geoms and theme elements provided by the ggpath backend.
    contents:
      - reexports
  - title: "Deprecated"
    desc: Former gtUtils names, kept so ported code keeps working.
    contents:
      - sdvplotR-deprecated

articles:
  - title: "Getting Started"
    contents:
      - getting-started
  - title: "Per-Sport Vignettes"
    desc: >
      Data ingest with the companion SportsDataverse package, then sdvplotR
      visualization, for each sport.
    contents:
      - nfl-viz
      - cfb-viz
      - nba-viz
      - wnba-viz
      - mlb-viz
      - nhl-viz
      - mbb-viz
      - wbb-viz
  - title: "Cookbooks"
    desc: >
      Cross-sport patterns: social-media export, leaderboard dashboards,
      reactable tables and end-to-end workflows.
    contents:
      - social-posting
      - leaderboard-dashboards
      - reactable-integration
      - workflows
  - title: "gt Tables"
    desc: >
      The SportsDataverse table themes, and the team layer and the gt table
      toolkit working together on one table.
    contents:
      - sdv-table-themes
      - gt-toolkit
  - title: "gt Table Cookbooks"
    desc: >
      Themes, legends, cut lines, faceted grids and saving, ported with the
      gtUtils functions from Andrew Weatherman's articles.
    contents:
      - styling
      - saving_tables
      - border_bars
      - delay_tables
      - grid_tables
      - schedule_matrix
      - tier_list
      - window_wins

