# Refresh the NFL headshot map and player id crosswalk sdvplotR reads at run
# time: rebuild the current season from nflverse rosters and republish it, with
# the combined map and crosswalk, to the sdvplotr_infrastructure release
# (data-raw/update_headshot_gsis_map.R). The data lives in the release, so a
# refresh reaches every sdvplotR install without a package update.
name: update-headshot-map

on:
  schedule:
    # Wednesdays 10:17 UTC, after the Monday night game and nflverse's roster update
    - cron: "17 10 * * 3"
  workflow_dispatch:
    inputs:
      mode:
        description: "current: rebuild this season; all: backfill 1999 onward"
        required: true
        default: current
        type: choice
        options: [current, all]

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-headshot-map
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MODE: ${{ inputs.mode || 'current' }}
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::nflreadr
          dependencies: '"hard"'
          install-pandoc: false

      - name: Rebuild and publish the headshot map
        run: Rscript data-raw/update_headshot_gsis_map.R "$MODE"
