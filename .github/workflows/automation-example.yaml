# Weekly run of the social automation example (examples/automation/sdvplotR_social.R) on live
# data, so the example keeps working. It makes the graphics, prints the would-be posts and uploads
# out/ as an artifact. Nothing is posted: this workflow has no Bluesky secrets and never passes
# --post, and the script also refuses --post in sdvplotR's own GitHub Actions.
name: automation-example

on:
  schedule:
    - cron: "30 13 * * 1" # Mondays 13:30 UTC: the weekend's games are final
  workflow_dispatch:
  pull_request:
    paths:
      - examples/automation/**
      - .github/workflows/automation-example.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: social graphics (dry-run)
    runs-on: ubuntu-latest # ships Chrome, which the leaderboard tables render in
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            local::.
            any::nflreadr
            any::hoopR
            any::wehoop
            any::fastRhockey
            any::baseballr
            any::httr2
            any::jsonlite
            any::webshot2
            any::ragg
            any::testthat
            any::withr

      - name: Test the script offline
        # the script's tests live beside it, outside the package, so they run here
        run: Rscript -e 'testthat::test_file("examples/automation/tests/test-sdvplotR_social.R", stop_on_failure = TRUE)'

      - name: Make the graphics (live data)
        # The NFL is in season in the fall and the NBA in the winter; the other runs exercise the
        # offseason fallbacks.
        run: |
          set -euo pipefail
          script=examples/automation/sdvplotR_social.R
          Rscript "$script" leaderboard --league nfl
          Rscript "$script" leaderboard --league nba --size landscape
          Rscript "$script" gameday --league nfl
          Rscript "$script" gameday --league nba

      - name: Print the would-be posts (dry-run)
        run: |
          for manifest in out/*/manifest.json; do
            Rscript examples/automation/sdvplotR_social.R post --manifest "$manifest"
          done

      - name: Upload the images and manifest
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: automation-example-out
          path: out/
          if-no-files-found: error
          retention-days: 14
