on:
  push:
    branches:
      - main
      - master
  release:
    types: [published]
  schedule:
    # Mondays 09:23 UTC: a broken upstream loader fails this run within a week instead of at the
    # next content push, and a green run redeploys the articles with fresh data. GitHub pauses
    # schedules in a repository with no commits for 60 days; re-enable it from the Actions tab.
    - cron: "23 9 * * 1"
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
        env:
          # cfb-viz.Rmd calls cfbfastR::load_cfb_schedules(), which needs a CollegeFootballData.com key
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          # workflows.Rmd merges live spreads from The Odds API (oddsapiR) when this is set
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs

      # After the deploy, so a dead card never blocks a content deploy; the run still turns red.
      # A renamed chunk leaves the gallery card pointing at a figure that is no longer built.
      - name: Check gallery images exist
        run: |
          cd docs/articles
          test -f gallery.html || { echo "::error::docs/articles/gallery.html was not built"; exit 1; }
          srcs=$(tr '\n' ' ' < gallery.html | grep -o '<img[^>]*src="[^"]*"' | sed 's/.*src="//; s/"$//')
          [ -n "$srcs" ] || { echo "::error::gallery.html has no images (markup changed?)"; exit 1; }
          missing=0
          for src in $srcs; do
            case "$src" in http*|data:*) continue ;; esac
            if [ ! -f "$src" ]; then
              echo "::error::gallery.html points at $src, which is not under docs/"
              missing=1
            fi
          done
          exit $missing
